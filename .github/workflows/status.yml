name: Update Discord Status

on:
  schedule:
    - cron: '0,30 * * * *'  # Alle 30 Minuten
  workflow_dispatch:        # Damit du es manuell starten kannst

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Wichtig: Darf in den Branch schreiben
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch and update status
        run: |
          API_URL="https://api.lanyard.rest/v1/users/1358450814980460780"
          
          # 1. Aktuelle API-Daten holen
          RESPONSE=$(curl -s $API_URL)
          STATUS=$(echo $RESPONSE | jq -r '.data.discord_status')
          
          # 2. Pfad zur Status-Datei
          FILE="status.json"
          
          # 3. Existierende Datei einlesen (falls vorhanden)
          if [ -f "$FILE" ]; then
            LAST_ONLINE=$(jq -r '.last_online' $FILE)
          else
            LAST_ONLINE="Nie"
          fi
          
          # 4. Aktuelle Zeit im ISO-Format holen
          CURRENT_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          # 5. Deine Logik: Nur updaten, wenn NICHT offline
          if [ "$STATUS" != "offline" ]; then
            echo "Status ist $STATUS. Speichere neue Zeit: $CURRENT_TIME"
            NEW_LAST_ONLINE=$CURRENT_TIME
          else
            echo "Status ist offline. Behalte alte Zeit: $LAST_ONLINE"
            NEW_LAST_ONLINE=$LAST_ONLINE
          fi
          
          # 6. Neue JSON-Datei schreiben
          echo "{\"status\": \"$STATUS\", \"last_online\": \"$NEW_LAST_ONLINE\"}" > $FILE

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "Update Discord status [skip ci]"
          git push
